<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The site's own mark: the accent square that flags availability and live
       projects, inside a ruled frame. Colours are the paper, ink and accent
       tokens of tokens.css (tokens.test.ts keeps them in step). Rasters:
       npm run icons -->
  <rect width="32" height="32" fill="#efede7"/>
  <rect x="1" y="1" width="30" height="30" fill="none" stroke="#111111" stroke-width="2"/>
  <rect x="9" y="9" width="14" height="14" fill="#be3418"/>
</svg>
