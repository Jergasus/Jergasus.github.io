name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

# Nothing by default: each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      activity-result: ${{ steps.activity.outputs.result }}
      activity-failed: ${{ steps.activity.outputs.failed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No later step pushes, so the token is not left in .git/config.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Never fails the deploy: on errors it keeps the committed numbers per
      # repo and reports through annotations and the step outputs.
      - name: Refresh activity snapshot
        id: activity
        run: npm run activity
        env:
          ACTIVITY_TOKEN: ${{ secrets.ACTIVITY_TOKEN }}

      # The content guards (copy rules, message parity, snapshot whitelist)
      # run against what is about to ship, refreshed snapshot included.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  # A job of its own, as in GitHub's Pages starter workflows: deploy-pages
  # looks the artifact up through the API, which may not list an upload made
  # moments earlier in the same job ("No artifacts named github-pages").
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # The site has deployed by now either way. If the activity fetch failed
  # (expired token, HTTP or network error), this job fails the run so GitHub
  # emails about it instead of the numbers going quietly stale. What to do:
  # docs/activity-token.md.
  activity-health:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the activity refresh
        env:
          RESULT: ${{ needs.build.outputs.activity-result }}
          FAILED: ${{ needs.build.outputs.activity-failed }}
        run: |
          echo "Activity refresh: ${RESULT}"
          if [ "${FAILED}" = "true" ]; then
            echo "::error title=Activity refresh failed::The site deployed, but with older activity numbers (${RESULT}). The build job's warnings name the repos that failed; docs/activity-token.md says what to do."
            exit 1
          fi
